[VOTE_QUOTAS]
; 2000組 → 3000組
quota_2000_to_3000 = 4
; 3000組 → 2000組
quota_3000_to_2000 = 2
; 3000組 → 3000組（不可投自己）
quota_3000_to_3000 = 2

[SYSTEM]
; data_directory = D:\Data\A3CIM_投票系統專用資料
data_directory = ./data
; 登入有效時數
token_hours = 8
host = 0.0.0.0
port = 5000

[AUTO_LOAD]
; 每月自動生成當月名單（修改後需重啟 Flask）
; false = 測試：啟動或有人登入時，當月名單不存在就自動生成
; true  = 正式：只在每月 day 號 start~end 之間由排程生成
enabled = false
day = 10
start = 00:00
end = 00:10

[ADMIN]
; 管理員工號，逗號分隔
admin_ids = K18251,G9745

[LDAP]
; true = 正式環境驗證 AD 密碼；false = 僅本機測試用（不驗證密碼）
enabled = true
server = ldap://KHADDC02.kh.asegroup.com
domain = kh
