<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>匿名投票系統</title>
    <script src="static/js/package/tailwinds.js"></script>
    <script src="static/js/package/vue.global.js"></script>
    <script src="static/js/package/sweetalert2@11.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* ================= 投票頁專用 ================= */
      body {
        background:
          radial-gradient(900px 420px at 85% -10%, rgba(62, 207, 142, 0.10), transparent 60%),
          radial-gradient(700px 400px at 0% 100%, rgba(23, 23, 23, 0.05), transparent 60%),
          #f1f1f2;
      }

      /* 深色頂部列 */
      .topbar-dark {
        background: #121212;
        color: #fafafa;
        border-bottom: 1px solid #262626;
      }
      .topbar-dark .brand-mark { background: var(--brand); color: var(--brand-ink); }
      .topbar-dark .crumb { color: #8f8f8f; }
      .btn-on-dark {
        background: transparent; border-color: #333; color: #e5e5e5;
      }
      .btn-on-dark:hover:not(:disabled) { background: #1f1f1f !important; color: #fff; }
      .user-chip {
        display: inline-flex; align-items: center; gap: 10px;
        height: 34px; padding: 0 12px 0 4px;
        border: 1px solid #2e2e2e; border-radius: 999px; background: #1a1a1a;
      }
      .avatar {
        width: 26px; height: 26px; border-radius: 999px; flex-shrink: 0;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 700;
      }
      .avatar-brand { background: var(--brand); color: var(--brand-ink); }

      /* 深色側欄 */
      .panel-dark {
        position: relative; overflow: hidden;
        background: #161616; color: #fafafa;
        border: 1px solid #262626; border-radius: 14px;
      }
      .panel-dark::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(to bottom, #000, transparent 70%);
        -webkit-mask-image: linear-gradient(to bottom, #000, transparent 70%);
      }
      .panel-dark::after {
        content: ''; position: absolute; width: 360px; height: 360px; right: -160px; top: -180px; pointer-events: none;
        background: radial-gradient(circle, rgba(62, 207, 142, .22), transparent 65%);
      }
      .panel-dark > * { position: relative; z-index: 1; }
      .pd-muted { color: #9a9a9a; }
      .pd-label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #8a8a8a; }
      .pd-divider { border-top: 1px solid #262626; }
      .panel-dark .badge-2000 { background: #fafafa; border-color: #fafafa; color: #121212; }
      .panel-dark .badge-3000 { background: transparent; border-color: #3a3a3a; color: #e5e5e5; }
      .pd-progress { height: 8px; border-radius: 999px; background: #262626; overflow: hidden; }
      .pd-progress > div { height: 100%; border-radius: 999px; background: #e5e5e5; transition: width .4s ease; }
      .pd-progress > div.done { background: var(--brand); box-shadow: 0 0 12px rgba(62,207,142,.45); }
      .big-num { font-size: 30px; font-weight: 650; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .rank-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; transition: background .15s; }
      .rank-row:hover { background: #1f1f1f; }
      .rank-bar { height: 4px; border-radius: 999px; background: #262626; overflow: hidden; margin-top: 6px; }
      .rank-bar > i { display: block; height: 100%; border-radius: 999px; background: #6b6b6b; }
      .rank-row:first-child .rank-bar > i { background: var(--brand); }
      .rank-medal { width: 24px; height: 24px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #262626; color: #d4d4d4; flex-shrink: 0; }
      .rank-medal.m1 { background: var(--brand); color: var(--brand-ink); }
      .rank-medal.m2 { background: #e5e5e5; color: #121212; }
      .rank-medal.m3 { background: #737373; color: #fff; }

      /* 候選人區 */
      .stage {
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 16px 40px -24px rgba(0,0,0,.18);
      }
      .stage-head {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(to bottom, #fcfcfc, #f7f7f7);
        border-radius: 14px 14px 0 0;
      }
      .cand {
        position: relative;
        display: flex; align-items: center; gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        transition: border-color .15s, box-shadow .15s, transform .15s, background .15s;
      }
      .cand.clickable { cursor: pointer; }
      .cand.clickable:hover { border-color: #c9c9c9; box-shadow: 0 6px 16px -10px rgba(0,0,0,.25); transform: translateY(-1px); }
      .cand.selected { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 0 1px var(--brand) inset, 0 8px 20px -12px rgba(62,207,142,.6); }
      .cand.disabled { opacity: .5; cursor: not-allowed; background: #fafafa; }
      .cand .avatar { width: 38px; height: 38px; font-size: 15px; }
      .av-2000 { background: #171717; color: #fafafa; }
      .av-3000 { background: #ececec; color: #262626; border: 1px solid #dcdcdc; }
      .cand.selected .avatar { background: var(--brand); color: var(--brand-ink); border-color: var(--brand-hover); }
      .cand .tick {
        position: absolute; top: -7px; right: -7px;
        width: 22px; height: 22px; border-radius: 999px;
        background: var(--brand); color: var(--brand-ink);
        display: inline-flex; align-items: center; justify-content: center;
        box-shadow: 0 0 0 3px #fff;
      }

      .seg-lg .seg-item { height: 32px; padding: 0 14px; font-size: 13px; }

      /* 深色底部動作列 */
      .dock {
        background: #121212; color: #fafafa;
        border-radius: 0 0 14px 14px;
        border-top: 1px solid #262626;
      }
      .dock-chip {
        display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
        height: 30px; padding: 0 6px 0 4px;
        border-radius: 999px; border: 1px solid #2e2e2e; background: #1c1c1c;
        font-size: 12px; color: #f5f5f5;
      }
      .dock-chip .avatar { width: 22px; height: 22px; font-size: 11px; }
      .dock-chip button { width: 20px; height: 20px; border-radius: 999px; color: #8f8f8f; display: inline-flex; align-items: center; justify-content: center; }
      .dock-chip button:hover { background: #2a2a2a; color: #fff; }
      .btn-submit { height: 44px; min-width: 180px; font-size: 15px; box-shadow: 0 0 0 1px var(--brand-hover), 0 8px 24px -8px rgba(62,207,142,.6); }
      .btn-submit:disabled { box-shadow: none; background: #2a2a2a; border-color: #333; color: #777; opacity: 1; }
      .dock .alert-danger { background: rgba(229,72,77,.12); border-color: rgba(229,72,77,.35); color: #ff9a9d; }
    </style>
  </head>
  <body class="h-screen overflow-hidden">
    <div id="app" v-cloak class="h-full flex flex-col">
      <!-- 載入中 -->
      <div v-if="isLoading" class="flex-1 flex items-center justify-center">
        <div class="flex items-center gap-3 muted">
          <svg class="spin w-5 h-5" fill="none" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity=".25"></circle>
            <path fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          載入中...
        </div>
      </div>

      <template v-if="!isLoading">
        <!-- ================= 頂部列 ================= -->
        <header class="topbar-dark flex-shrink-0">
          <div class="h-14 px-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="brand-mark">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </span>
              <span class="font-semibold">匿名投票系統</span>
              <span class="crumb">/</span>
              <span class="crumb">投票</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="user-chip mr-1">
                <span class="avatar avatar-brand">{{ status.name ? status.name.charAt(0) : '' }}</span>
                <span class="text-sm font-medium">{{ status.name }}</span>
                <span class="mono" style="color: #8f8f8f">{{ status.emp_id }}</span>
              </span>
              <button @click="goToAdmin" class="btn btn-on-dark">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m6 10V5m6 14v-7m4 7H2" />
                </svg>
                查看統計
              </button>
              <button @click="logout" class="btn btn-on-dark" style="border-color: transparent" title="登出">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                登出
              </button>
            </div>
          </div>
        </header>

        <!-- ================= 主內容 ================= -->
        <main class="flex-1 min-h-0 p-4 grid gap-4 fade-up" style="grid-template-columns: 320px minmax(0, 1fr)">
          <!-- 左側：深色資訊欄 -->
          <aside class="panel-dark flex flex-col min-h-0">
            <!-- 問候 + 本月票數 -->
            <div class="p-5 flex-shrink-0">
              <div class="flex items-center justify-between">
                <span class="pd-label">本月投票</span>
                <span v-if="status.can_vote" class="badge" style="background: rgba(62,207,142,.12); border-color: rgba(62,207,142,.35); color: var(--brand)">
                  <span class="dot"></span>進行中
                </span>
                <span v-else class="badge" style="background: #222; border-color: #333; color: #bbb">已投完</span>
              </div>

              <p class="mt-4 text-lg font-semibold" style="letter-spacing: -0.02em">嗨，{{ status.name }}</p>
              <p class="pd-muted text-sm mt-0.5 flex items-center gap-2">
                您是 <span :class="groupBadge(status.group)">{{ status.group }}組</span>
              </p>

              <div class="flex items-end gap-2 mt-5">
                <span class="big-num">{{ status.votes_used }}</span>
                <span class="pd-muted mb-1.5">/ {{ status.max_votes }} 票已使用</span>
              </div>

              <div class="mt-4 space-y-4">
                <div v-for="g in targetGroups" :key="'bar-' + g">
                  <div class="flex items-center justify-between mb-2 text-sm">
                    <span class="flex items-center gap-2">投給 <span :class="groupBadge(g)">{{ g }}組</span></span>
                    <span class="text-xs font-semibold" :style="{ color: status.remaining[g] === 0 ? 'var(--brand)' : '#bdbdbd' }">
                      {{ status.remaining[g] === 0 ? '✓ 已完成' : `剩 ${status.remaining[g]} 票` }}
                    </span>
                  </div>
                  <div class="pd-progress">
                    <div
                      :class="{ done: status.remaining[g] === 0 }"
                      :style="{ width: (status.quota[g] ? status.used[g] / status.quota[g] * 100 : 0) + '%' }"
                    ></div>
                  </div>
                  <p class="mono pd-muted mt-1.5">{{ status.used[g] }} / {{ status.quota[g] }}</p>
                </div>
              </div>

              <div v-if="!status.can_vote" class="mt-4 rounded-lg px-3 py-2.5 text-sm" style="background: #1f1f1f; border: 1px solid #2e2e2e">
                <p class="font-semibold" style="color: var(--brand)">{{ status.message }}</p>
                <p class="pd-muted text-xs mt-0.5">仍可瀏覽候選人與查看統計</p>
              </div>
            </div>

            <div class="pd-divider"></div>

            <!-- 排行榜 -->
            <div class="flex-1 min-h-0 flex flex-col p-3">
              <div class="flex items-center justify-between px-2 pt-1 pb-2">
                <span class="pd-label">票數排行 Top 5</span>
                <span class="pd-muted text-xs">全體</span>
              </div>
              <div class="flex-1 overflow-y-auto scroll-thin">
                <p v-if="leaderboard.length === 0" class="pd-muted text-center text-sm py-8">目前還沒有投票記錄</p>
                <div v-for="(item, index) in leaderboard" :key="item.emp_id" class="rank-row">
                  <span class="rank-medal" :class="'m' + (index + 1)">{{ index + 1 }}</span>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                      <span class="text-sm font-medium truncate">{{ item.name }}</span>
                      <span class="text-sm font-semibold tabular-nums">{{ item.vote_count }}<span class="pd-muted text-xs font-normal"> 票</span></span>
                    </div>
                    <div class="flex items-center gap-2 mt-0.5">
                      <span class="mono pd-muted">{{ item.emp_id }}</span>
                      <span :class="groupBadge(item.group)" style="height: 18px; font-size: 10px">{{ item.group }}組</span>
                    </div>
                    <div class="rank-bar"><i :style="{ width: (item.vote_count / leaderboard[0].vote_count * 100) + '%' }"></i></div>
                  </div>
                </div>
              </div>
            </div>
          </aside>

          <!-- 右側：候選人 -->
          <section class="stage min-h-0 flex flex-col">
            <!-- 標題 + 工具列 -->
            <div class="stage-head flex-shrink-0">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <h1 class="text-lg font-semibold" style="letter-spacing: -0.02em">選擇候選人</h1>
                  <p class="text-xs muted mt-0.5">
                    點選卡片加入，可投對象：
                    <template v-for="(g, i) in targetGroups" :key="'t-' + g">
                      <span v-if="i > 0">、</span><b style="color: var(--text)">{{ g }}組 {{ status.quota[g] }} 票</b>
                    </template>
                    ，同一人每月限投一次
                  </p>
                </div>
                <div class="flex items-center gap-3">
                  <!-- 組別切換：已投完的組別會自動隱藏 -->
                  <div v-if="visibleGroups.length > 1" class="seg seg-lg">
                    <button
                      v-for="g in visibleGroups"
                      :key="g"
                      @click="switchGroup(g)"
                      :class="{ 'seg-active': groupFilter === g }"
                      class="seg-item"
                    >
                      投 {{ g }}組 <span class="subtle">· 剩 {{ status.remaining[g] }}</span>
                    </button>
                  </div>
                  <div class="input-icon" style="width: 260px">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5-5m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" v-model="candidateSearch" placeholder="搜尋姓名或工號" class="input" />
                  </div>
                </div>
              </div>
            </div>

            <!-- 計數列 -->
            <div class="px-4 py-2 flex items-center justify-between text-xs muted flex-shrink-0" style="border-bottom: 1px solid var(--border)">
              <span>
                顯示 <b style="color: var(--text)">{{ paginatedCandidates.length }}</b> / {{ filteredCandidates.length }} 位
                <span class="subtle">（共 {{ candidates.length }} 位候選人）</span>
              </span>
              <span v-if="selectedCandidates.length > 0 || targetGroups.length > 1" class="font-medium" style="color: var(--text)">
                {{ selectedSummary }}
              </span>
            </div>

            <!-- 候選人卡片 -->
            <div class="flex-1 min-h-0 overflow-y-auto scroll-thin p-4" style="background: #fbfbfb">
              <div v-if="paginatedCandidates.length === 0" class="h-full flex flex-col items-center justify-center subtle py-10">
                <svg class="w-10 h-10 mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5-5m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <p class="text-sm">找不到符合的候選人</p>
              </div>
              <div v-else class="grid grid-cols-2 xl:grid-cols-3 gap-3">
                <div
                  v-for="candidate in paginatedCandidates"
                  :key="candidate.emp_id"
                  @click="selectCandidate(candidate)"
                  :class="candidateClass(candidate)"
                  class="cand"
                >
                  <span class="avatar" :class="candidate.group === '2000' ? 'av-2000' : 'av-3000'">{{ candidate.name.charAt(0) }}</span>
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold truncate">{{ candidate.name }}</p>
                    <p class="mono subtle mt-0.5">{{ candidate.emp_id }}</p>
                  </div>
                  <div class="flex flex-col items-end gap-1 flex-shrink-0">
                    <span :class="groupBadge(candidate.group)">{{ candidate.group }}組</span>
                    <span v-if="isVoted(candidate)" class="badge badge-success" style="height: 18px; font-size: 10px">✓ 本月已投</span>
                  </div>
                  <span v-if="isSelected(candidate)" class="tick">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                  </span>
                </div>
              </div>
            </div>

            <!-- 分頁 -->
            <div v-if="totalPages > 1" class="px-4 py-2 flex items-center justify-between flex-shrink-0" style="border-top: 1px solid var(--border)">
              <span class="text-xs subtle">第 {{ currentPage }} / {{ totalPages }} 頁</span>
              <div class="flex items-center gap-2">
                <button @click="currentPage--" :disabled="currentPage === 1" class="btn">← 上一頁</button>
                <button @click="currentPage++" :disabled="currentPage === totalPages" class="btn">下一頁 →</button>
              </div>
            </div>

            <!-- 深色動作列 -->
            <div class="dock px-4 py-3 space-y-2 flex-shrink-0">
              <div v-if="errorMessage" class="alert alert-danger">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>{{ errorMessage }}</span>
              </div>
              <div class="flex items-center gap-3">
                <div class="flex-shrink-0 pr-3" style="border-right: 1px solid #2a2a2a">
                  <p class="pd-label">已選</p>
                  <p class="text-lg font-semibold tabular-nums leading-tight">{{ selectedCandidates.length }}<span class="pd-muted text-sm font-normal"> 位</span></p>
                </div>
                <div class="flex-1 min-w-0 flex items-center gap-2 overflow-x-auto scroll-thin py-1">
                  <span v-if="selectedCandidates.length === 0" class="pd-muted text-sm">點選上方候選人卡片加入投票</span>
                  <span v-for="candidate in selectedCandidates" :key="'sel-' + candidate.emp_id" class="dock-chip">
                    <span class="avatar" :class="candidate.group === '2000' ? 'avatar-brand' : 'av-3000'">{{ candidate.name.charAt(0) }}</span>
                    {{ candidate.name }}
                    <span class="mono" style="color: #8f8f8f">{{ candidate.group }}</span>
                    <button @click.stop="selectCandidate(candidate)" title="取消選擇">✕</button>
                  </span>
                  <button v-if="selectedCandidates.length > 0" @click="selectedCandidates = []" class="btn btn-on-dark flex-shrink-0" style="height: 30px; border-color: transparent">
                    清空
                  </button>
                </div>
                <button
                  @click="submitVote"
                  :disabled="selectedCandidates.length === 0 || !status.can_vote || isSubmitting"
                  class="btn btn-primary btn-submit flex-shrink-0"
                >
                  {{ submitButtonText }}
                  <svg v-if="selectedCandidates.length > 0 && status.can_vote && !isSubmitting" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14m-6-6l6 6-6 6" />
                  </svg>
                </button>
              </div>
            </div>
          </section>
        </main>
      </template>
    </div>

    <script>
      // 後端位址：預設與網頁同一台主機的 5000 port
      const API_BASE = window.API_BASE || `http://${location.hostname || '127.0.0.1'}:5000`;

      function getSession() {
        try {
          return {
            token: sessionStorage.getItem('vote_token'),
            user: JSON.parse(sessionStorage.getItem('vote_user') || 'null'),
          };
        } catch (e) {
          return { token: null, user: null };
        }
      }

      async function apiFetch(path, options = {}) {
        const { token } = getSession();
        const response = await fetch(`${API_BASE}${path}`, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token || ''}`,
            ...(options.headers || {}),
          },
        });
        if (response.status === 401) {
          window.location.href = 'login.html';
          throw new Error('登入已逾時');
        }
        const data = await response.json().catch(() => ({}));
        return { ok: response.ok, status: response.status, data };
      }

      const { createApp } = Vue;

      createApp({
        data() {
          return {
            isLoading: true,
            isSubmitting: false,
            status: {
              emp_id: '',
              name: '',
              group: '',
              quota: {},
              used: {},
              remaining: {},
              can_vote: false,
              message: '',
              voted_for_ids: [],
            },
            candidates: [],
            candidateSearch: '',
            groupFilter: '',
            selectedCandidates: [],
            errorMessage: '',
            leaderboard: [],
            currentPage: 1,
            itemsPerPage: 24,
          };
        },
        computed: {
          targetGroups() {
            return Object.keys(this.status.quota).filter((g) => this.status.quota[g] > 0);
          },
          // 可切換的組別：還有票的組別；票全部用完時顯示全部組別供瀏覽
          visibleGroups() {
            const available = this.targetGroups.filter((g) => this.status.remaining[g] > 0);
            return available.length > 0 ? available : this.targetGroups;
          },
          filteredCandidates() {
            const search = this.candidateSearch.toLowerCase();
            return this.candidates.filter(
              (c) =>
                c.group === this.groupFilter &&
                (c.name.toLowerCase().includes(search) || c.emp_id.toLowerCase().includes(search))
            );
          },
          totalPages() {
            return Math.ceil(this.filteredCandidates.length / this.itemsPerPage);
          },
          paginatedCandidates() {
            const start = (this.currentPage - 1) * this.itemsPerPage;
            return this.filteredCandidates.slice(start, start + this.itemsPerPage);
          },
          selectedByGroup() {
            const count = {};
            this.selectedCandidates.forEach((c) => (count[c.group] = (count[c.group] || 0) + 1));
            return count;
          },
          // 例：2000組 ✓ 已投完、3000組 已選 2/2
          selectedSummary() {
            return this.targetGroups
              .map((g) => {
                const remaining = this.status.remaining[g] || 0;
                if (remaining === 0) return `${g}組 ✓ 已投完`;
                return `${g}組 已選 ${this.selectedByGroup[g] || 0}/${remaining}`;
              })
              .join('、');
          },
          submitButtonText() {
            if (!this.status.can_vote) return '投票功能已鎖定';
            if (this.isSubmitting) return '送出中...';
            return this.selectedCandidates.length > 0 ? `確認投票 (${this.selectedCandidates.length})` : '請選擇候選人';
          },
        },
        watch: {
          candidateSearch() {
            this.currentPage = 1;
          },
          groupFilter() {
            this.currentPage = 1;
            this.candidateSearch = '';
          },
        },
        async mounted() {
          const { token, user } = getSession();
          if (!token || !user) {
            window.location.href = 'login.html';
            return;
          }
          if (!user.in_roster) {
            // 不在名單內的管理員只能使用後台
            window.location.href = 'admin_panel.html';
            return;
          }
          await this.loadData();
        },
        methods: {
          groupBadge(group) {
            return group === '2000' ? 'badge badge-2000' : 'badge badge-3000';
          },
          isSelected(candidate) {
            return this.selectedCandidates.some((c) => c.emp_id === candidate.emp_id);
          },
          isVoted(candidate) {
            return this.status.voted_for_ids.includes(candidate.emp_id);
          },
          candidateClass(candidate) {
            if (!this.status.can_vote) return 'disabled';
            if (this.isVoted(candidate)) return 'disabled';
            if (this.isSelected(candidate)) return 'clickable selected';
            return 'clickable';
          },

          // 切換組別時保留已選的候選人，可分開投或兩組一起投
          switchGroup(g) {
            this.errorMessage = '';
            this.groupFilter = g;
          },

          // preferGroup：重新載入後優先停留的組別（已投完則自動切到其他組）
          async loadData(preferGroup = null) {
            const { user } = getSession();
            try {
              const { ok, data } = await apiFetch(`/api/candidates/${encodeURIComponent(user.emp_id)}`);
              if (!ok) throw new Error(data.error || '載入失敗');

              this.status = data.voter_info;
              this.candidates = data.candidates;
              this.selectedCandidates = [];

              const want = preferGroup || this.groupFilter;
              this.groupFilter = this.visibleGroups.includes(want) ? want : this.visibleGroups[0] || '';

              await this.loadStatistics();
              this.isLoading = false;
            } catch (error) {
              console.error('loadData 失敗:', error);
              await Swal.fire({ title: '載入失敗', text: error.message, icon: 'error', confirmButtonText: '返回登入頁' });
              window.location.href = 'login.html';
            }
          },

          logout() {
            if (confirm('確定要登出嗎?')) {
              window.location.href = 'login.html';
            }
          },

          goToAdmin() {
            window.location.href = 'admin_panel.html';
          },

          showError(msg) {
            this.errorMessage = msg;
            setTimeout(() => {
              if (this.errorMessage === msg) this.errorMessage = '';
            }, 3000);
          },

          selectCandidate(candidate) {
            if (!this.status.can_vote) return;

            if (this.isVoted(candidate)) {
              Swal.fire({
                title: '⚠️ 已投過此候選人',
                html: `您本月已經投過 <strong>${candidate.name} (${candidate.emp_id})</strong><br><br>無法重複投票,請選擇其他候選人`,
                icon: 'warning',
                confirmButtonColor: '#d97706',
                confirmButtonText: '知道了',
                customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-lg px-6 py-3' },
              });
              return;
            }

            const index = this.selectedCandidates.findIndex((c) => c.emp_id === candidate.emp_id);
            if (index > -1) {
              this.selectedCandidates.splice(index, 1);
              this.errorMessage = '';
              return;
            }

            const g = candidate.group;
            const remaining = this.status.remaining[g] || 0;
            if ((this.selectedByGroup[g] || 0) >= remaining) {
              this.showError(remaining === 0 ? `${g}組的票已投完` : `${g}組已選滿 ${remaining} 位，請先取消其他人再選`);
              return;
            }
            this.selectedCandidates.push(candidate);
            this.errorMessage = '';
          },

          async submitVote() {
            // 投票期間限制（每月10-18號）— 目前停用，需要時取消註解
            // const today = new Date().getDate();
            // if (today < 10 || today > 18) {
            //   Swal.fire({ title: '⏳ 投票期間限制', html: `投票期間為每月 <strong>10-18 號</strong>`, icon: 'warning' });
            //   return;
            // }

            if (this.selectedCandidates.length === 0) {
              this.errorMessage = '請至少選擇一位候選人';
              return;
            }

            const candidatesList = this.selectedCandidates
              .map((c, i) => `${i + 1}. <strong>${c.name}</strong> (${c.emp_id}) · ${c.group}組`)
              .join('<br>');

            const result = await Swal.fire({
              title: '確認投票',
              html: `確定要投票給以下 <strong>${this.selectedCandidates.length}</strong> 位候選人嗎?<br><br>
                    <div class="swal-list">${candidatesList}</div>
                    <span class="text-danger">投票後無法修改</span>`,
              icon: 'question',
              showCancelButton: true,
              confirmButtonColor: '#4F46E5',
              cancelButtonColor: '#6B7280',
              confirmButtonText: '確認投票',
              cancelButtonText: '取消',
              customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-lg px-6 py-3', cancelButton: 'rounded-lg px-6 py-3' },
            });
            if (!result.isConfirmed) return;

            this.isSubmitting = true;
            try {
              const { ok, data } = await apiFetch('/api/vote', {
                method: 'POST',
                body: JSON.stringify({ voted_for_emp_ids: this.selectedCandidates.map((c) => c.emp_id) }),
              });

              if (!ok) {
                await Swal.fire({
                  title: data.duplicates ? '❌ 投票已取消' : '投票失敗',
                  html: data.duplicates ? `${data.error}<br><br>本次投票已<strong>整筆取消</strong>` : data.error || '投票失敗',
                  icon: 'error',
                  confirmButtonColor: '#dc2626',
                  confirmButtonText: '確定',
                  customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-lg px-6 py-3' },
                });
                await this.loadData();
                return;
              }

              const voted = this.selectedCandidates.length;
              const votedGroups = [...new Set(this.selectedCandidates.map((c) => c.group))];
              this.status = data.status;
              this.selectedCandidates = [];
              this.errorMessage = '';

              await Swal.fire({
                title: '✅ 投票成功!',
                html: `感謝您的參與<br><br>您已成功投出 <strong>${voted}</strong> 票<br>
                      本月已使用 <strong>${data.votes_used}/${data.max_votes}</strong> 票`,
                icon: 'success',
                timer: 2000,
                showConfirmButton: false,
                customClass: { popup: 'rounded-2xl' },
              });

              if (this.status.can_vote) {
                // 判斷剛剛投的組別哪些已投完；繼續投票時隱藏已投完的組別，切到還有票的組別
                const doneGroups = votedGroups.filter((g) => (this.status.remaining[g] || 0) === 0);
                const openGroups = this.targetGroups.filter((g) => this.status.remaining[g] > 0);
                const nextGroup = openGroups.includes(this.groupFilter) ? this.groupFilter : openGroups[0];
                const remainText = openGroups
                  .map((g) => `<strong>${g}組 ${this.status.remaining[g]}</strong> 票`)
                  .join('、');

                const next = await Swal.fire({
                  title: doneGroups.length ? `✅ ${doneGroups.map((g) => g + '組').join('、')} 已投完` : '📊 還有剩餘票數',
                  html: `您還可以投：${remainText}<br><br>是否要繼續投票?`,
                  icon: 'info',
                  showCancelButton: true,
                  confirmButtonColor: '#f59e0b',
                  cancelButtonColor: '#6366f1',
                  confirmButtonText: `🗳️ 繼續投 ${nextGroup}組`,
                  cancelButtonText: '📊 查看統計',
                  allowOutsideClick: false,
                  allowEscapeKey: false,
                  customClass: { popup: 'rounded-2xl', confirmButton: 'rounded-lg px-6 py-3', cancelButton: 'rounded-lg px-6 py-3' },
                });
                if (next.isConfirmed) {
                  await this.loadData(nextGroup);
                } else {
                  this.goToAdmin();
                }
              } else {
                await Swal.fire({
                  title: '🎉 已投完所有票數!',
                  text: '您本月的投票配額已用完，即將前往統計頁面',
                  icon: 'success',
                  timer: 2000,
                  showConfirmButton: false,
                  allowOutsideClick: false,
                  customClass: { popup: 'rounded-2xl' },
                });
                this.goToAdmin();
              }
            } catch (error) {
              console.error('投票錯誤:', error);
              this.errorMessage = '投票失敗,請稍後再試';
            } finally {
              this.isSubmitting = false;
            }
          },

          async loadStatistics() {
            try {
              const { ok, data } = await apiFetch('/api/statistics');
              this.leaderboard = ok ? data.vote_stats.slice(0, 5) : [];
            } catch (error) {
              console.error('載入統計失敗', error);
            }
          },
        },
      }).mount('#app');
    </script>
  </body>
</html>
